name: Edge CI Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_CODE: edge
  ARTIFACT_SOURCE_TYPE: external_url

jobs:
  # Windows SMTC bridge DLL. The binaries are not committed to the repository —
  # they are built here and injected into src/main/resources before packaging,
  # so the shipped jar can never contain a stale binary built from older C++.
  build-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build fpsmaster-smtc (x64 + x86)
        shell: pwsh
        run: |
          cmake -S native/smtc -B native/smtc/build-x64 -A x64
          cmake --build native/smtc/build-x64 --config Release
          cmake -S native/smtc -B native/smtc/build-win32 -A Win32
          cmake --build native/smtc/build-win32 --config Release

      - name: Collect DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/x64, dist/x86 | Out-Null
          Copy-Item native/smtc/build-x64/Release/fpsmaster-smtc.dll dist/x64/
          Copy-Item native/smtc/build-win32/Release/fpsmaster-smtc.dll dist/x86/
          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smtc-native
          path: dist
          if-no-files-found: error

  build:
    needs: build-native
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.decision.outputs.should_publish }}
      channel: ${{ steps.channel.outputs.channel }}
      should_build: ${{ steps.decision.outputs.should_build }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      asset_name: ${{ steps.meta.outputs.asset_name }}
      checksum: ${{ steps.meta.outputs.checksum }}
      file_size: ${{ steps.meta.outputs.file_size }}
      aot_asset_name: ${{ steps.meta.outputs.aot_asset_name }}
      aot_checksum: ${{ steps.meta.outputs.aot_checksum }}
      aot_file_size: ${{ steps.meta.outputs.aot_file_size }}
      changelog: ${{ steps.meta.outputs.changelog }}
      commit_hash: ${{ steps.meta.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release channel and version
        id: channel
        shell: bash
        run: |
          # Publish only from semver tags:
          #   v1.0.0           -> release / 1.0.0
          #   v1.0.0-beta.1    -> beta    / 1.0.0-beta.1
          channel=""
          should_publish="false"
          version_name=""
          release_tag=""

          # Publish exclusively from version tags (branch pushes only build).
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
            version_name="${GITHUB_REF_NAME#v}"
            if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
              echo "Invalid version tag: ${GITHUB_REF_NAME} (expected vMAJOR.MINOR.PATCH[-prerelease])" >&2
              exit 1
            fi
            if [[ "$version_name" == *-* ]]; then
              channel="beta"
            else
              channel="release"
            fi
            should_publish="true"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            should_publish="false"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

      - name: Finalize build decision
        id: decision
        shell: bash
        run: |
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "should_publish=${{ steps.channel.outputs.should_publish }}" >> "$GITHUB_OUTPUT"

      - name: Resolve semver version name
        id: version
        if: steps.decision.outputs.should_build == 'true'
        shell: bash
        run: |
          channel="${{ steps.channel.outputs.channel }}"
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-8 | tr '[:upper:]' '[:lower:]')"
          if [ "${{ steps.channel.outputs.should_publish }}" = "true" ]; then
            version_name="${GITHUB_REF_NAME#v}"
            release_tag="${GITHUB_REF_NAME}"
          else
            base="$(grep -E '^[[:space:]]*version[[:space:]]*=' gradle.properties | head -n1 | sed -E 's/^[^=]+=//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^["'\'']//; s/["'\'']$//')"
            core="$(printf '%s' "$base" | sed -E 's/^v//; s/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
            if [ -z "$core" ]; then
              echo "Could not parse semver core from gradle version='$base'" >&2
              exit 1
            fi
            version_name="${core}-ci.${GITHUB_RUN_NUMBER}+${short_sha}"
            release_tag="edge-${version_name}"
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Resolved Edge version: $version_name (channel=${channel:-none}, publish=${{ steps.channel.outputs.should_publish }})"

      - name: Set up JDK 17
        if: steps.decision.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        if: steps.decision.outputs.should_build == 'true'
        uses: gradle/actions/setup-gradle@v3

      - name: Check out Prism UI
        if: steps.decision.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: FPSMasterTeam/fpsmaster-prism
          ref: d9449168f3c37d0b5b99202092e32278087028af
          path: fpsmaster-prism

      - name: Install Prism UI
        if: steps.decision.outputs.should_build == 'true'
        working-directory: fpsmaster-prism
        run: |
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal

      - name: Inject SMTC native libraries
        if: steps.decision.outputs.should_build == 'true'
        uses: actions/download-artifact@v4
        with:
          name: smtc-native
          path: src/main/resources/native/windows

      - name: Verify native libraries are present
        if: steps.decision.outputs.should_build == 'true'
        shell: bash
        run: |
          for arch in x64 x86; do
            dll="src/main/resources/native/windows/$arch/fpsmaster-smtc.dll"
            if [ ! -s "$dll" ]; then
              echo "Missing or empty $dll — the jar would silently ship without SMTC" >&2
              exit 1
            fi
            echo "$arch: $(stat -c%s "$dll") bytes, sha256 $(sha256sum "$dll" | awk '{print $1}')"
          done

      - name: Build with Gradle Wrapper
        if: steps.decision.outputs.should_build == 'true'
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          chmod +x ./gradlew
          # Keep in-game CLIENT_VERSION in sync with the published semver.
          python3 - <<'PY'
          import pathlib, re, os
          path = pathlib.Path("src/main/java/top/fpsmaster/FPSMaster.java")
          text = path.read_text(encoding="utf-8")
          version = os.environ["VERSION_NAME"]
          updated, n = re.subn(
              r'CLIENT_VERSION\s*=\s*"[^"]*"',
              f'CLIENT_VERSION = "{version}"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit("Failed to stamp CLIENT_VERSION")
          path.write_text(updated, encoding="utf-8")
          print(f"Stamped CLIENT_VERSION={version}")
          PY
          # Forge Modrinth jar + Forge-free AOT zip (launcher no-Forge path).
          # Stamp the computed semver into the build so jar/AOT match the published versionName.
          ./gradlew build packageAotDistribution -Pversion="$VERSION_NAME"

      - name: Capture artifact metadata
        id: meta
        if: steps.decision.outputs.should_build == 'true'
        shell: bash
        run: |
          # Prefer the remapped Forge mod jar; never pick sources/dev jars.
          artifact_path="$(find build/libs -maxdepth 1 -type f \( -name 'FPSMaster-edge.jar' -o -name 'FPSMaster-edge-*.jar' -o -name 'FPSMaster-*.jar' \) ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1)"
          if [ -z "$artifact_path" ]; then
            artifact_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name 'fpsmaster-runtime.jar' | sort | head -n 1)"
          fi
          if [ -z "$artifact_path" ]; then
            echo "No jar artifact found in build/libs" >&2
            exit 1
          fi

          aot_path="$(find build/libs -maxdepth 1 -type f -name 'fpsmaster-edge-aot-*.zip' | sort | head -n 1)"
          if [ -z "$aot_path" ]; then
            echo "No AOT zip found in build/libs (expected fpsmaster-edge-aot-*.zip)" >&2
            exit 1
          fi

          asset_name="$(basename "$artifact_path")"
          aot_asset_name="$(basename "$aot_path")"
          commit_hash="${GITHUB_SHA}"
          version_name="${{ steps.version.outputs.version_name }}"
          release_tag="${{ steps.version.outputs.release_tag }}"
          checksum="$(sha256sum "$artifact_path" | awk '{print $1}')"
          file_size="$(stat -c%s "$artifact_path")"
          aot_checksum="$(sha256sum "$aot_path" | awk '{print $1}')"
          aot_file_size="$(stat -c%s "$aot_path")"

          {
            echo "artifact_path=$artifact_path"
            echo "asset_name=$asset_name"
            echo "commit_hash=$commit_hash"
            echo "version_name=$version_name"
            echo "release_tag=$release_tag"
            echo "checksum=$checksum"
            echo "file_size=$file_size"
            echo "aot_asset_name=$aot_asset_name"
            echo "aot_checksum=$aot_checksum"
            echo "aot_file_size=$aot_file_size"
          } >> "$GITHUB_OUTPUT"

          {
            echo "changelog<<EOF"
            git log -1 --pretty=format:'%s%n%n%b'
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        if: steps.decision.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: edge-build
          # Semver builds produce FPSMaster-<version>.jar (not FPSMaster-edge.jar).
          path: |
            build/libs/FPSMaster-*.jar
            build/libs/fpsmaster-edge-aot-*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: edge-build
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Edge ${{ needs.build.outputs.version_name }}
          body: ${{ needs.build.outputs.changelog }}
          files: |
            dist/FPSMaster-*.jar
            dist/fpsmaster-edge-aot-*.zip
          fail_on_unmatched_files: false

      - name: Upload to Qiniu OSS and notify release API
        shell: bash
        env:
          FPSMASTER_CI_API_BASE_URL: ${{ secrets.FPSMASTER_CI_API_BASE_URL }}
          FPSMASTER_CI_UPLOAD_TOKEN: ${{ secrets.FPSMASTER_CI_UPLOAD_TOKEN }}
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_S3_ENDPOINT: ${{ secrets.QINIU_S3_ENDPOINT }}
          QINIU_S3_REGION: ${{ secrets.QINIU_S3_REGION }}
          QINIU_CDN_BASE_URL: ${{ secrets.QINIU_CDN_BASE_URL }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          COMMIT_HASH: ${{ needs.build.outputs.commit_hash }}
          FILE_SIZE: ${{ needs.build.outputs.file_size }}
          CHECKSUM: ${{ needs.build.outputs.checksum }}
          AOT_CHECKSUM: ${{ needs.build.outputs.aot_checksum }}
          AOT_FILE_SIZE: ${{ needs.build.outputs.aot_file_size }}
          CHANGELOG: ${{ needs.build.outputs.changelog }}
        run: |
          if [ -z "$FPSMASTER_CI_API_BASE_URL" ] || [ -z "$FPSMASTER_CI_UPLOAD_TOKEN" ]; then
            echo "Release API secrets are not configured" >&2
            exit 1
          fi
          if [ -z "$QINIU_ACCESS_KEY" ] || [ -z "$QINIU_SECRET_KEY" ] || [ -z "$QINIU_BUCKET" ] || [ -z "$QINIU_S3_ENDPOINT" ] || [ -z "$QINIU_CDN_BASE_URL" ]; then
            echo "Qiniu OSS secrets are not configured" >&2
            exit 1
          fi

          python3 -m pip install --quiet --user boto3

          artifact_path="$(find dist -maxdepth 1 -type f -name 'FPSMaster-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1)"
          if [ -z "$artifact_path" ]; then
            echo "No jar artifact found in dist" >&2
            ls -la dist >&2 || true
            exit 1
          fi

          aot_path="$(find dist -maxdepth 1 -type f -name 'fpsmaster-edge-aot-*.zip' | sort | head -n 1)"
          if [ -z "$aot_path" ]; then
            echo "No AOT zip found in dist" >&2
            exit 1
          fi

          upload_oss() {
            local path="$1"
            local key="$2"
            ARTIFACT_PATH="$path" OBJECT_KEY="$key" python3 -c "import os,boto3; e=os.environ['QINIU_S3_ENDPOINT'].rstrip('/'); c=os.environ['QINIU_CDN_BASE_URL'].rstrip('/'); b=os.environ['QINIU_BUCKET']; k=os.environ['OBJECT_KEY']; p=os.environ['ARTIFACT_PATH']; client=boto3.client('s3', endpoint_url=e, aws_access_key_id=os.environ['QINIU_ACCESS_KEY'], aws_secret_access_key=os.environ['QINIU_SECRET_KEY'], region_name=os.environ.get('QINIU_S3_REGION') or 'ap-southeast-1'); client.upload_file(p,b,k); print(f'{c}/{k}')"
          }

          jar_name="$(basename "$artifact_path")"
          aot_name="$(basename "$aot_path")"
          download_url="$(upload_oss "$artifact_path" "edge/${CHANNEL}/${VERSION_NAME}/${COMMIT_HASH}/${jar_name}")"
          aot_download_url="$(upload_oss "$aot_path" "edge/${CHANNEL}/${VERSION_NAME}/${COMMIT_HASH}/aot/${aot_name}")"
          echo "Uploaded jar -> ${download_url}"
          echo "Uploaded aot -> ${aot_download_url}"

          changelog_json="$(printf '%s' "$CHANGELOG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"

          cat <<EOF > payload.json
          {
            "productCode": "${PRODUCT_CODE}",
            "channelCode": "${CHANNEL}",
            "versionName": "${VERSION_NAME}",
            "commitHash": "${COMMIT_HASH}",
            "artifactSourceType": "external_url",
            "downloadUrl": "${download_url}",
            "fileSize": ${FILE_SIZE},
            "checksum": "${CHECKSUM}",
            "aotDownloadUrl": "${aot_download_url}",
            "aotChecksum": "${AOT_CHECKSUM}",
            "aotFileSize": ${AOT_FILE_SIZE},
            "recommended": true,
            "mandatory": false,
            "changelog": ${changelog_json}
          }
          EOF

          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-CI-Token: ${FPSMASTER_CI_UPLOAD_TOKEN}" \
            --data @payload.json \
            "${FPSMASTER_CI_API_BASE_URL%/}/api/v1/launcher/releases/ci"

      - name: Publish to Modrinth
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          CHANGELOG: ${{ needs.build.outputs.changelog }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          COMMIT_HASH: ${{ needs.build.outputs.commit_hash }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "MODRINTH_TOKEN not configured; skipping Modrinth publish"
            exit 0
          fi

          project_id="${MODRINTH_PROJECT_ID:-EYsVyax4}"
          artifact_path="$(find dist -maxdepth 1 -type f -name 'FPSMaster-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1)"
          if [ -z "$artifact_path" ]; then
            echo "No jar artifact found in dist" >&2
            exit 1
          fi

          # Modrinth version_number: URL-safe, unique per project, max 32 chars.
          # Use +1.8.9 suffix (same scheme as Nova) so Edge never collides with
          # Fabric version_numbers and stays visible under forge/1.8.9 filters.
          short_sha="$(printf '%s' "$COMMIT_HASH" | cut -c1-7)"
          version_number="$(printf '%s' "${VERSION_NAME}+1.8.9" | tr -cd 'A-Za-z0-9._+-')"
          case "$CHANNEL" in
            release) version_type="release" ;;
            beta)    version_type="beta" ;;
            *)
              echo "Unsupported channel for Modrinth: $CHANNEL" >&2
              exit 1
              ;;
          esac
          version_number="$(printf '%s' "$version_number" | cut -c1-32)"
          if [ -z "$version_number" ]; then
            version_number="edge-${short_sha}"
          fi

          jq -n \
            --arg name "Edge ${VERSION_NAME}" \
            --arg version_number "$version_number" \
            --arg changelog "$CHANGELOG" \
            --arg version_type "$version_type" \
            --arg project_id "$project_id" \
            '{
              name: $name,
              version_number: $version_number,
              changelog: $changelog,
              dependencies: [],
              game_versions: ["1.8.9"],
              version_type: $version_type,
              loaders: ["forge"],
              featured: ($version_type == "release"),
              project_id: $project_id,
              file_parts: ["file"],
              primary_file: "file"
            }' > modrinth-data.json

          echo "Publishing $artifact_path to Modrinth project $project_id as $version_number ($version_type)"
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -F "data=@modrinth-data.json;type=application/json" \
            -F "file=@${artifact_path}" \
            "https://api.modrinth.com/v2/version" \
            | python -c 'import json,sys; v=json.load(sys.stdin); print("Modrinth version id:", v.get("id"), "url: https://modrinth.com/mod/fpsmaster/version/" + (v.get("id") or ""))'

      - name: Publish to CurseForge
        # Optional platform publish — do not fail the Edge release if CF token/API rejects.
        continue-on-error: true
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          CHANGELOG: ${{ needs.build.outputs.changelog }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          # Upload API token from https://console.curseforge.com/ (or account API Tokens).
          # Must NOT be a Core API key, bcrypt hash, or Overwolf session cookie.
          CURSEFORGE_TOKEN="$(printf '%s' "$CURSEFORGE_TOKEN" | tr -d '[:space:]')"
          if [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "CURSEFORGE_TOKEN not configured; skipping CurseForge publish"
            exit 0
          fi
          if [[ "$CURSEFORGE_TOKEN" == \$2* ]] || [[ "$CURSEFORGE_TOKEN" == '$2'* ]]; then
            echo "::warning::CURSEFORGE_TOKEN looks like a bcrypt hash, not a CurseForge Upload API token; skipping"
            exit 0
          fi

          project_id="${CURSEFORGE_PROJECT_ID:-1081006}"
          artifact_path="$(find dist -maxdepth 1 -type f -name 'FPSMaster-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1)"
          if [ -z "$artifact_path" ]; then
            echo "No jar artifact found in dist" >&2
            exit 1
          fi

          case "$CHANNEL" in
            release) release_type="release" ;;
            beta)    release_type="beta" ;;
            *)
              echo "Unsupported channel for CurseForge: $CHANNEL" >&2
              exit 0
              ;;
          esac

          # Resolve numeric gameVersion IDs (upload API requires IDs):
          # - type 4 = Minecraft 1.8 → 1.8.9
          # - type 68441 = Modloader → Forge
          # - type 75208 = Environment → Client (required by upload API)
          # Do NOT use endswith("1.8.9") — that also matches NeoForge "21.8.9" (id 13648).
          versions_body="$(mktemp)"
          versions_code="$(curl --silent --show-error \
            -H "X-Api-Token: ${CURSEFORGE_TOKEN}" \
            -o "$versions_body" -w '%{http_code}' \
            "https://minecraft.curseforge.com/api/game/versions" || true)"
          if [ "$versions_code" != "200" ]; then
            echo "::warning::CurseForge game/versions returned HTTP ${versions_code} (token invalid or not an Upload API token). Body:"
            head -c 500 "$versions_body" || true
            echo
            echo "Get a token at https://console.curseforge.com/ → API Tokens, then: gh secret set CURSEFORGE_TOKEN -R FPSMasterTeam/FPSMaster-Edge"
            exit 0
          fi
          versions_json="$(cat "$versions_body")"

          game_version_ids="$(printf '%s' "$versions_json" | jq -r '
            [
              .[]
              | select(
                  ((.name // "") == "1.8.9" and (.gameVersionTypeID == 4))
                  or ((.name // "") == "Forge" and (.gameVersionTypeID == 68441))
                  or ((.name // "") == "Client" and (.gameVersionTypeID == 75208))
                )
              | .id
            ]
            | unique | sort | @csv' | tr -d '"')"
          if [ -z "$game_version_ids" ] || [ "$(printf '%s' "$game_version_ids" | awk -F, '{print NF}')" -lt 3 ]; then
            echo "::warning::Could not resolve CurseForge game version IDs for 1.8.9 / Forge / Client; got: ${game_version_ids:-<empty>}; skipping"
            exit 0
          fi
          echo "Resolved CurseForge gameVersions: ${game_version_ids}"
          gv_json="[${game_version_ids}]"

          jq -n \
            --arg changelog "${CHANGELOG:-Edge ${VERSION_NAME}}" \
            --arg displayName "Edge ${VERSION_NAME}" \
            --arg releaseType "$release_type" \
            --argjson gameVersions "$gv_json" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersions: $gameVersions,
              releaseType: $releaseType
            }' > curseforge-metadata.json

          echo "Publishing $artifact_path to CurseForge project $project_id ($release_type)"
          upload_body="$(mktemp)"
          upload_code="$(curl --silent --show-error \
            -X POST \
            -H "X-Api-Token: ${CURSEFORGE_TOKEN}" \
            -F "metadata=<curseforge-metadata.json;type=application/json" \
            -F "file=@${artifact_path}" \
            -o "$upload_body" -w '%{http_code}' \
            "https://minecraft.curseforge.com/api/projects/${project_id}/upload-file" || true)"
          if [ "$upload_code" != "200" ]; then
            echo "::warning::CurseForge upload-file returned HTTP ${upload_code}. Body:"
            head -c 800 "$upload_body" || true
            echo
            exit 0
          fi
          python -c 'import json,sys; r=json.load(open(sys.argv[1])); print("CurseForge file id:", r.get("id"))' "$upload_body"
